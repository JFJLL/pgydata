[package]
name = "magiorix-core"
version = "1.4.2"
edition = "2021"
rust-version = "1.85"
description = "Magiorix constrained native authorization core"
license = "UNLICENSED"
publish = false

[dependencies]
base64 = "=0.22.1"
base64ct = "=1.6.0"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
hmac = "=0.12.1"
hpke = { version = "=0.12.0", features = ["x25519"] }
rmp-serde = "=1.3.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
thiserror = "=1.0.64"
time = { version = "=0.3.36", features = ["parsing"] }
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
zeroize = "=1.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
overflow-checks = true

[profile.dev]
overflow-checks = true
